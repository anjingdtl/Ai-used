org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
// 使用已安装的 JDK 17 运行 Gradle 守护进程与 AGP 编译
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
// 沙箱 egress 代理：Gradle/AGP 依赖下载走该代理（与系统 HTTP(S)_PROXY 一致）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1