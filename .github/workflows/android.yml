name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      - name: Smoke-test desktop bridge parsers
        run: python3 desktop-bridge/bridge_self_test.py

      - name: Bridge HTTP server integration tests
        run: python3 desktop-bridge/bridge_http_test.py

      - name: Release APK must not leak debug mock strings
        run: |
          unzip -o -q app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' -d /tmp/rel-dex
          if grep -aRqE "MockScenario|DebugQuotaProvider" /tmp/rel-dex; then
            echo "::error::Release APK contains debug-only mock strings"
            exit 1
          fi
          echo "OK: release APK has no debug mock strings"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk